<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARFALL ARENA — Neon Arena Survival Shooter</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #050816; }
  #arena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="arena" aria-label="STARFALL ARENA: pilot a starfighter, survive waves of enemies, level up and clear the sector"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/game.js"></script>
</body>
</html>
